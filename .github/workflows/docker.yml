name: Build Docker Image

on:
  pull_request:
    paths:
      - '.seqera/**'
      - '.github/workflows/docker.yml'
  push:
    branches:
      - windows
    paths:
      - '.seqera/Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      # renovate: datasource=docker depName=public.cr.seqera.io/platform/connect-client
      connect_client_version:
        description: 'Version of connect-client to use (e.g., 0.9)'
        required: false
        type: string
        default: '0.10'

env:
  CONNECT_CLIENT_VERSION: ${{ inputs.connect_client_version || '0.10' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set local image tag
        id: imagetag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=windows:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=windows:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build windows image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./.seqera
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            CONNECT_CLIENT_VERSION=${{ env.CONNECT_CLIENT_VERSION }}
          tags: ${{ steps.imagetag.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Custom Studios Example Container for Windows/Wine
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=windows
          cache-to: type=gha,mode=max,scope=windows

      - name: Run security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.imagetag.outputs.ref }}
          format: "table"
          output: "trivy-results.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Display security scan results
        if: always()
        run: |
          echo "## Security scan — windows" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-results.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload security scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-scan-windows-${{ github.run_id }}
          path: trivy-results.txt
          retention-days: 30

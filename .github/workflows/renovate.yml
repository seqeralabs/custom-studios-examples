name: Renovate

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.16
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}

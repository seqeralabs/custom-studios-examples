# Serve the full-window Studio page and proxy everything else to the Waymote
# gateway. start-waymote replaces the __PLACEHOLDERS__ at startup.
worker_processes 1;
daemon off;
pid __RUNTIME_DIRECTORY__/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen __LISTEN_ADDRESS__;
        root /usr/local/share/waymote-studio;

        location = / {
            try_files /index.html =404;
            include /etc/nginx/waymote-headers.conf;
        }

        location ~ ^/studio\.(css|js)$ {
            include /etc/nginx/waymote-headers.conf;
        }

        location / {
            proxy_pass http://127.0.0.1:__GATEWAY_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
